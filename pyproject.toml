[project]
name = "fmm_methods"
version = "0.1.0"
description = "FMM-accelerated 2D vortex panel method (clean Python rewrite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmm_vpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "xfoil: needs the XFOIL binary; required on the dev machine (fails, never skips, if missing). Exclude with -m 'not xfoil'.",
]
